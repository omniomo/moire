name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml
            themes/pnpm-lock.yaml

      - name: Inject Memos from memos branch
        # The repository ID survives ownership transfers and excludes user forks.
        if: github.event.repository.id == 1147685883
        run: |
          git fetch origin memos
          git checkout origin/memos -- src/memos || echo "Memos branch not found or empty"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          VITE_MOIRE_NAV: ${{ github.event.repository.id == 1147685883 }}
        run: pnpm run build

      - name: Include the official docs and theme gallery
        if: github.event.repository.id == 1147685883
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs run build
          pnpm --dir themes install --frozen-lockfile
          pnpm --dir themes run build
          cp -R docs/dist build/docs
          cp -R themes/build build/themes
          printf '\nSitemap: https://moire.ooooomo.com/docs/sitemap-index.xml\nSitemap: https://moire.ooooomo.com/themes/sitemap.xml\n' >> build/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
